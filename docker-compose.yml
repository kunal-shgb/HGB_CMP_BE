# Local development services. Credentials come from .env (git-ignored); see .env.example.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cmp
      POSTGRES_USER: cmp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cmp -d cmp"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"

volumes:
  pgdata:
